<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Echoes of Time</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<section id="welcome">

    <div class="overlay"></div>

    <div class="card">

        <img src="images/logo.gif" class="logo">

        <h1>Echoes of Time</h1>

        <p>
            Welcome to the Antiquities Museum.
            <br>
            Your mission is to restore history.
        </p>

        <input
            type="text"
            id="playerName"
            placeholder="Enter Your Name"
        >

        <h2>Choose Character</h2>

        <div class="characters">

            <img
                src="images/boy.jpeg"
                id="boy"
                class="character"
            >

            <img
                src="images/girl.png"
                id="girl"
                class="character"
            >

        </div>

        <button id="startBtn">
            START ADVENTURE
        </button>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
